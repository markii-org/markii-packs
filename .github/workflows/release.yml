name: Release

# Fires on a version tag (v1.2.3). Builds every pack's prebuilt form and
# zips it as a `.mkp` archive, then attaches the archives to the GitHub
# release for that tag (creating the release if it does not exist yet).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:mkp
      - name: Attach pack archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.mkp \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --repo "${{ github.repository }}" \
            || gh release upload "${{ github.ref_name }}" dist/*.mkp \
                 --repo "${{ github.repository }}" \
                 --clobber
